<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  
  <!-- 装饰元素 -->
  <circle cx="200" cy="150" r="80" fill="white" fill-opacity="0.1" />
  <circle cx="1000" cy="500" r="120" fill="white" fill-opacity="0.1" />
  <circle cx="800" cy="200" r="60" fill="white" fill-opacity="0.15" />
  
  <!-- 主要标题 -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">
    ResumeAI
  </text>
  
  <!-- 副标题 -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#f0f0f0">
    AI简历优化工具
  </text>
  
  <!-- 功能描述 -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#d1d5db">
    智能评估 • 专业优化 • 提升求职成功率
  </text>
  
  <!-- 网址 -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#9ca3af">
    resume-ai.com
  </text>
  
  <!-- AI图标装饰 -->
  <g transform="translate(500, 450)">
    <path d="M0 0 L30 -20 L60 0 L30 20 Z" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="30" cy="0" r="10" fill="#ffffff" fill-opacity="0.3" />
  </g>
</svg>