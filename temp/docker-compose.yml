version: '3.8'

services:
  # 开发环境（带热重载）
  app-dev:
    build:
      context: .
      target: builder
      dockerfile: Dockerfile
    container_name: next-app-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-ecSExTz0QHfncyQcahzaGLYqKDjuIwIy}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BETTER_AUTH_API_KEY=${BETTER_AUTH_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - DEFAULT_EVAL_CREDITS=${DEFAULT_EVAL_CREDITS:-3}
      - DEFAULT_OPT_CREDITS=${DEFAULT_OPT_CREDITS:-0}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
    networks:
      - app-network

  # 生产环境
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: next-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-ecSExTz0QHfncyQcahzaGLYqKDjuIwIy}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BETTER_AUTH_API_KEY=${BETTER_AUTH_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - DEFAULT_EVAL_CREDITS=${DEFAULT_EVAL_CREDITS:-3}
      - DEFAULT_OPT_CREDITS=${DEFAULT_OPT_CREDITS:-0}
    volumes:
      - ./sqlite.db:/app/sqlite.db
      - ./logs:/app/logs
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/get-session"]
      interval: 30s
      timeout: 10s
      retries: 3

  # nginx反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge